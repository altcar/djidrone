name: Refresh dataset manifests

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh manifests from Hugging Face
        run: python3 tools/refresh_manifest.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json pano/dynamic.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Auto-refresh manifests from HF dataset"
          git push
